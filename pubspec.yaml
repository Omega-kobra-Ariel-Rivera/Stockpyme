name: stock_pyme
description: "StockPyme: inventario y punto de venta para almacenes, minimarkets y pymes. Hecho por Rivera Systems."
publish_to: 'none'
version: 1.5.0+6

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Textos de Flutter (botones del sistema, calendario) en español, inglés y portugués
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.0.0
  http: ^1.2.2
  url_launcher: ^6.3.1
  # Cuentas (email y Google) y datos en la nube
  firebase_core: ">=4.0.0 <8.0.0"
  firebase_auth: ">=6.0.0 <10.0.0"
  cloud_firestore: ">=6.0.0 <10.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Ícono de la app (se genera en GitHub Actions con: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_foreground_inset: 16

# Pantalla de inicio nativa (se genera con: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#0F766E"
  image: assets/branding/splash_logo.png
  branding: assets/branding/branding.png
  branding_mode: bottom
  android_12:
    color: "#0F766E"
    image: assets/branding/splash_android12.png
    branding: assets/branding/branding.png
  ios: false
  web: false
