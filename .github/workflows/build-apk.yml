# Genera el APK de StockPyme automáticamente en GitHub.
# - Cada push a main: el APK queda en Releases como versión de prueba.
#   (Se usa Releases porque no consume el espacio de Artifacts de la cuenta.)
# - Al crear una etiqueta vX.Y.Z: además se publica como Release descargable.
name: Generar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Si el portal de plugins de Gradle falla ("Could not find
      # org.jetbrains.kotlin..."), Gradle busca también en Maven Central y Google.
      - name: Repositorios de respaldo para Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/repositorios-respaldo.gradle <<'EOF'
          beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  mavenCentral()
                  google()
                  gradlePluginPortal()
              }
          }
          EOF
          cat ~/.gradle/init.d/repositorios-respaldo.gradle

      - name: Crear carpeta android si falta
        run: |
          if [ ! -d android ]; then
            flutter create --org cl.riverasystems --project-name stock_pyme --platforms android .
          fi

      - name: Permiso de cámara y minSdk 23
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' "$MANIFEST"
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' "$f"
          done
          grep -n "CAMERA" "$MANIFEST"

      - name: Protección (sin respaldos) y capturas permitidas
        run: |
          FILE=$(find android/app/src/main -name 'MainActivity.kt' | head -1)
          PKG=$(grep '^package' "$FILE")
          cat > "$FILE" <<EOF
          $PKG

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup' "$MANIFEST" || \
            sed -i 's#<application#<application android:allowBackup="false" android:fullBackupContent="false"#' "$MANIFEST"
          echo "--- $FILE"; cat "$FILE"

      - name: Reglas de compilación (evita que se borren complementos)
        run: |
          cat > android/app/proguard-rules.pro <<'EOF'
          -keep class io.flutter.plugins.** { *; }
          -keep class io.flutter.plugin.** { *; }
          -keep class com.github.dart_lang.jni.** { *; }
          -keep class kotlin.** { *; }
          -keep class kotlinx.coroutines.** { *; }
          -keep class dev.steenbakker.mobile_scanner.** { *; }
          -keep class com.android.billingclient.** { *; }
          -keep class com.google.firebase.** { *; }
          -keep class io.grpc.** { *; }
          -dontwarn com.google.android.play.core.**
          EOF
          cat android/app/proguard-rules.pro

      - name: Desactivar limpieza de código (R8)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'EOF'

          // StockPyme: sin R8 para no borrar clases de los complementos.
          android {
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }
          EOF
            tail -12 android/app/build.gradle.kts
          else
            cat >> android/app/build.gradle <<'EOF'

          // StockPyme: sin R8 para no borrar clases de los complementos.
          android {
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF
            tail -12 android/app/build.gradle
          fi

      - name: Revisar configuración de Firebase
        run: |
          if grep -q "ARCHIVO TEMPORAL" lib/firebase_options.dart; then
            echo "::warning::Falta configurar Firebase (flutterfire configure). La app abrirá con el aviso 'Falta configurar Firebase'."
          else
            echo "Firebase configurado."
          fi

      - name: Firma fija del APK (secretos de GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin el secreto KEYSTORE_BASE64 el APK se firma con una llave temporal: el inicio con Google no funcionará y habrá que desinstalar para actualizar."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat >> android/app/build.gradle.kts <<'EOF'

          // StockPyme: firma fija (llave guardada en los secretos de GitHub).
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("upload-keystore.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF
          echo "Firma fija configurada."

      - name: Descargar paquetes
        run: flutter pub get

      - name: Generar ícono y pantalla de inicio
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: Renombrar APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mv build/app/outputs/flutter-apk/app-release.apk "StockPyme-v${VERSION}.apk"
          echo "APK_NAME=StockPyme-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Publicar APK de prueba (cada push a main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "StockPyme prueba (build ${{ github.run_number }})"
          prerelease: true
          files: ${{ env.APK_NAME }}

      # Link fijo que siempre baja el APK más nuevo (para la página web y el QR):
      # https://github.com/<usuario>/<repo>/releases/download/descargas/StockPyme.apk
      - name: Descarga directa (siempre la última versión)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: cp "${{ env.APK_NAME }}" StockPyme.apk

      - name: Publicar descarga directa
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: descargas
          name: "StockPyme — descargar"
          body: |
            Última versión de StockPyme.
            - Android: StockPyme.apk
            - Windows: StockPyme-Instalador.exe
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: StockPyme.apk

      - name: Publicar versión oficial (solo con etiqueta vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
