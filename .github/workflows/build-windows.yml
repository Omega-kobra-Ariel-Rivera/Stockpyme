# Genera StockPyme para Windows (programa de escritorio) en GitHub.
# - Cada push a main: instalador .exe y versión portátil .zip en Releases.
# - Al crear una etiqueta vX.Y.Z: también se adjuntan a la versión oficial.
name: Generar programa Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear carpeta windows si falta
        shell: bash
        run: |
          if [ ! -d windows ]; then
            flutter create --org cl.riverasystems --project-name stock_pyme --platforms windows .
          fi

      - name: Nombre de la ventana
        shell: bash
        run: |
          sed -i 's/L"stock_pyme"/L"StockPyme"/' windows/runner/main.cpp
          grep -n "StockPyme" windows/runner/main.cpp || true

      - name: Revisar configuración de Firebase
        shell: bash
        run: |
          if grep -q "ARCHIVO TEMPORAL" lib/firebase_options.dart; then
            echo "::warning::Falta configurar Firebase (flutterfire configure)."
          elif ! grep -q "windows" lib/firebase_options.dart; then
            echo "::warning::firebase_options.dart no incluye Windows. Ejecuta flutterfire configure con --platforms=android,web,windows."
          else
            echo "Firebase configurado para Windows."
          fi

      - name: Descargar paquetes
        run: flutter pub get

      - name: Ícono del programa
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_windows.yaml

      # Google en el PC: los datos vienen de los secretos del repositorio
      # (si no están, el programa funciona igual, sin el botón de Google).
      - name: Compilar para Windows
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        shell: bash
        run: >-
          flutter build windows --release --obfuscate
          --split-debug-info=build/debug-info-windows
          --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID"
          --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"

      - name: Incluir librerías de Visual C++
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $release -Force }
          }
          Get-ChildItem $release | Select-Object Name, Length

      - name: Versión
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Versión portátil (.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "StockPyme-Windows-v$env:VERSION.zip" -Force

      - name: Instalador (.exe)
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "installer\stockpyme.iss"

      - name: Publicar versión de prueba (cada push a main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: "StockPyme Windows prueba (build ${{ github.run_number }})"
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            StockPyme-Instalador-v*.exe
            StockPyme-Windows-v*.zip

      # Link fijo que siempre baja el instalador más nuevo (repositorio público
      # stockpyme-descargas; necesita el secreto DESCARGAS_TOKEN):
      # https://github.com/Omega-kobra-Ariel-Rivera/stockpyme-descargas/releases/download/descargas/StockPyme-Instalador.exe
      - name: Descarga directa (siempre la última versión)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "StockPyme-Instalador-v*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName "StockPyme-Instalador.exe" -Force }
          $zip = Get-ChildItem "StockPyme-Windows-v*.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) { Copy-Item $zip.FullName "StockPyme-Windows.zip" -Force }

      - name: Publicar descarga directa
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository_owner }}/stockpyme-descargas
          token: ${{ secrets.DESCARGAS_TOKEN }}
          target_commitish: main
          tag_name: descargas
          name: "StockPyme — descargar"
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            StockPyme-Instalador.exe
            StockPyme-Windows.zip

      - name: Publicar versión oficial (solo con etiqueta vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            StockPyme-Instalador-v*.exe
            StockPyme-Windows-v*.zip
